.ubody{display:grid;grid-template-columns:1fr;gap:12px}

.lcd .nmx{font-size:1.1rem;font-weight:800;margin:1px 0 6px}
.lcd .sm{font-size:.7rem;margin:-4px 0 6px}
.dg{display:flex;gap:6px;margin:6px 0}
.dg span{width:42px;height:52px;border:2px solid #222;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700}
.hint{margin-top:auto;border-top:1px solid #222;padding-top:6px;font-size:.78rem}
.fim{margin:auto;text-align:center}.fim b{display:block;font-size:5rem;line-height:1}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start}
.k{font:700 1.3rem Arial,sans-serif;padding:14px 0;border:0;border-radius:6px;background:#2b2b2b;color:#fff;cursor:pointer;box-shadow:0 2px 0 #000}
.k:active{transform:translateY(2px);box-shadow:none}
.k.br{background:#fff;color:#111;border:2px solid #555;font-size:.8rem}
.k.co{background:#e8772e;color:#111;font-size:.8rem}
.k.ok{background:#2e9c4f;color:#fff;font-size:.8rem}
</style>

  var b=writeBatch(fdb);
  (await getDocs(collection(fdb,'ballots'))).forEach(function(d){b.delete(d.ref);});
  (await getDocs(collection(fdb,'voters'))).forEach(function(d){b.delete(d.ref);});
  b.delete(doc(fdb,'config','main'));await b.commit();S.confirm='';S.msg='';
 }catch(e){S.msg='Não foi possível iniciar ('+errTxt(e)+').';S.confirm='';render();}
}
async function closeVote(){
 try{await db.doc('config/main').update({status:'closed'});S.confirm='';}
 catch(e){S.msg='Não foi possível encerrar ('+errTxt(e)+').';S.confirm='';render();}
}
async function startRound2(){
 var c=S.cfg,f=finalistsFrom(tally(c,1));
 try{await db.doc('config/main').update({round:2,status:'open',finalists:f});}
 catch(e){S.msg='Não foi possível abrir o 2º turno ('+errTxt(e)+').';render();}
}

/* telas */
function openView(c){
 var r=rnd(c),t=tally(c,r),p=[];
 if(!S.uid)p.push(note('Entre com sua conta para votar.'));
 else if(S.canWrite===false)p.push(note('Seu acesso é somente de leitura, então não dá para votar. Peça ao organizador para convidar você com permissão de colaborador.'));
 else{
  if(r===2)p.push(note('Nenhuma opção passou de 50% no 1º turno. Neste turno votam apenas as mais votadas.'));
  p.push(urna(c),h('p',{class:'mut'},'Também funciona pelo teclado: números, Enter (confirma), Backspace (corrige) e B (branco). Votos em branco/nulos '+(c.blankCounts?'entram':'não entram')+' no cálculo dos 50%. O voto é secreto e não pode ser alterado.'),
   h('button',{class:'ghost',onclick:function(){S.mute=!S.mute;render();}},'Som: '+(S.mute?'desligado':'ligado')));
 }
 p.push(h('p',{class:'mut'},t.voters+' de '+c.expected+' votos registrados neste turno.'));
 if(S.admin){
  var a=h('div',{class:'card'},h('p',{class:'mut'},'Painel do organizador'));
  if(r===1&&!t.total&&!t.voters)a.append(h('button',{class:'ghost',onclick:reconf},'Editar candidatos (antes do primeiro voto)'));
  if(S.confirm!=='close')a.append(h('button',{class:'ghost',onclick:function(){S.confirm='close';render();}},'Encerrar o '+r+'º turno e mostrar resultado'));
  else a.append(h('p',{class:'mut'},'Ninguém mais poderá votar neste turno. Confirmar?'),h('button',{class:'btn',onclick:closeVote},'Sim, encerrar'),h('button',{class:'ghost',onclick:function(){S.confirm='';render();}},'Cancelar'));
  p.push(a);
 }
 return p;
}
function bars(c,t,idxs){
 var card=h('div',{class:'card'});
 idxs.forEach(function(i){var x=c.cands[i],n=t.counts[i];
  card.append(h('div',{class:'row'+(n===t.max&&n>0?' win':'')},
   h('div',{class:'top'},h('span',{class:'nm'},h('img',{class:'th',src:x.photo||PH,alt:''}),x.n+' · '+x.name+(x.sigla?' ('+x.sigla+')':'')),h('span',{},n+' ('+pct(n,t.base)+')')),
   h('div',{class:'track'},h('div',{class:'fill',style:'width:'+(t.base?n*100/t.base:0)+'%'}))));});
 if(t.blank)card.append(h('p',{class:'mut'},'Brancos: '+t.bl+' · Nulos: '+t.nu+(c.blankCounts?' ('+pct(t.blank,t.total)+' dos votos)':' (não entram no cálculo)')));
 return card;
}
function results(c){
 var r=rnd(c),p=[];
 if(r===2){var t1=tally(c,1);p.push(h('div',{class:'card'},h('p',{class:'mut'},'Resultado do 1º turno'),h('p',{class:'mut'},'Nenhuma opção passou de 50%.')),bars(c,t1,all(c)));}
 var t=tally(c,r),cand=r===2?c.finalists:all(c);
 p.push(h('div',{class:'card'},h('p',{class:'mut'},'Resultado do '+r+'º turno'),h('p',{class:'q'},c.question)),bars(c,t,cand));
 var leaders=cand.filter(function(i){return t.counts[i]===t.max;});
 var names=function(a){return a.map(function(i){return c.options[i];}).join(', ');};
 if(t.invalid)p.push(warn('Atenção: foram contados '+t.total+' votos para '+t.voters+' votantes registrados (esperados: '+c.expected+'). Este turno deve ser considerado inválido e repetido.'));
 else if(!t.base||t.max===0)p.push(note('Nenhum voto válido neste turno (sem votos ou só votos em branco/nulos). Repitam a votação.'));
 else{
  var box=h('div',{class:'card'}),w=leaders.length===1?leaders[0]:-1;
  var win=function(lbl,txt){var x=c.cands[w];box.append(h('div',{class:'cinfo'},h('div',{},h('p',{class:'q'},lbl+x.n+' · '+x.name+(x.sigla?' ('+x.sigla+')':'')),h('p',{class:'mut'},(x.vice?'Vice: '+x.vice+'. ':'')+txt)),h('img',{class:'th',src:x.photo||PH,alt:'',style:'width:70px;height:93px'})));};
  if(r===1){
   if(w>=0&&t.counts[w]*2>t.base)win('Vencedora: ',pct(t.counts[w],t.base)+' dos votos'+(c.blankCounts?'':' válidos')+', mais de 50%. Não há 2º turno.');
   else{
    var f=finalistsFrom(t);
    box.append(h('p',{class:'q'},'Haverá 2º turno'),h('p',{class:'mut'},'Nenhuma opção passou de 50%. Passam para o 2º turno: '+names(f)+'.'));
    box.append(S.admin?h('button',{class:'btn',onclick:startRound2},'Abrir 2º turno'):h('p',{class:'mut'},'Aguarde o organizador abrir o 2º turno.'));
   }
  }else{
   if(w>=0)win('Resultado final: ',pct(t.counts[w],t.base)+' dos votos no 2º turno.');
   else box.append(h('p',{class:'q'},'Empate no 2º turno'),h('p',{class:'mut'},'Empatadas: '+names(leaders)+'. Combinem a forma de desempate, como um sorteio.'));
  }
  box.append(h('p',{class:'mut'},'Conferência: '+t.total+' votos e '+t.voters+' votantes registrados.'));
  p.push(box);
 }
 var a=h('div',{class:'card'},h('p',{class:'mut'},'Painel do organizador'));
 if(S.confirm!=='new')a.append(h('button',{class:'ghost',onclick:function(){S.confirm='new';render();}},'Iniciar nova votação'));
 else a.append(h('p',{class:'mut'},'Os resultados atuais deixarão de aparecer. Confirmar?'),h('button',{class:'btn',onclick:newVote},'Sim, iniciar nova votação'),h('button',{class:'ghost',onclick:function(){S.confirm='';render();}},'Cancelar'));
 if(S.admin)p.push(a);
 return p;
}
function body(){
 if(S.auth==='cfg')return note('Falta configurar o Firebase. Abra o README e cole as chaves do seu projeto no início do arquivo index.html.');
 if(S.auth==='load')return note('Carregando…');
 if(S.auth==='out')return h('div',{class:'card'},h('p',{class:'q'},'Entre para votar'),h('p',{class:'mut'},'Use a conta Google do e-mail que o organizador cadastrou.'),S.msg&&warn(S.msg),h('button',{class:'btn',onclick:signIn},'Entrar com Google'));
 if(S.auth==='denied')return h('div',{class:'card'},h('p',{class:'q'},'E-mail não autorizado'),h('p',{class:'mut'},(S.email||'')+' não está na lista de eleitores. Fale com o organizador.'),h('button',{class:'ghost',onclick:signOutFn},'Sair'));
 if(!S.ready||!S.cfgLoaded)return note(S.slow?'Ainda não consegui acessar os dados'+(S.dbErr?' ('+S.dbErr+')':'')+'. Verifique a conexão.':'Carregando…');
 var c=S.cfg;
 if(!c)return S.admin?setup():note('O organizador ainda não abriu a votação.');
 if(rnd(c)!==S.lastRound){S.lastRound=rnd(c);S.digits='';S.mode='';S.confirm='';}
 return [S.msg&&warn(S.msg),c.status==='closed'?results(c):openView(c)];
}
function render(){app.replaceChildren(h('div',{class:'wrap'},h('h1',{},'Urna do clube'),S.fatal&&warn('Erro: '+S.fatal),body()));}

var subbed=false;
function signIn(){signInWithPopup(auth,new GoogleAuthProvider()).catch(function(e){S.msg='Não foi possível entrar ('+errTxt(e)+').';render();});}
function signOutFn(){signOut(auth);}
function subscribe(){
 if(subbed)return;subbed=true;
 function err(e){S.slow=true;S.dbErr=(e&&e.code)||'erro';render();}
 db.doc('config/main').onSnapshot(function(s){S.cfg=s.exists?norm(s.data()):null;S.cfgLoaded=true;render();},err);
 db.collection('voters').onSnapshot(function(s){S.vdocs=s.docs.map(function(d){return {id:d.id,data:d.data()};});render();},err);
 db.collection('ballots').onSnapshot(function(s){S.ballots=s.docs.map(function(d){return d.data();});render();},err);
}
function init(){
 setTimeout(function(){if(S.auth==='in'&&!S.cfgLoaded){S.slow=true;render();}},10000);
 setTimeout(function(){if(S.auth==='load'){S.auth='out';S.msg='O login demorou para responder. Toque em Entrar com Google para continuar.';render();}},6000);
 if(FIREBASE.apiKey.indexOf('COLE')===0){S.auth='cfg';return render();}
 render();
 onAuthStateChanged(auth,async function(u){
  S.msg='';
  if(!u){S.auth='out';S.uid=null;S.ready=false;return render();}
  S.uid=u.uid;S.email=(u.email||'').toLowerCase();S.admin=S.email===ADMIN_EMAIL.toLowerCase();
  var ok=S.admin;
  if(!ok){try{ok=(await getDoc(doc(fdb,'allowed',S.email))).exists();}catch(e){ok=false;}}
  if(!ok){S.auth='denied';return render();}
  S.auth='in';S.canWrite=true;S.ready=true;subscribe();render();
 });
}
init();
})();
</script>
</body>
</html>
